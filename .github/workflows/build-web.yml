name: Build Web (Meson + Emscripten)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cmark (Native)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmark
          # Verify installation (optional but useful for debugging)
          cmark --version

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '6.0.13'
          actions-cache-folder: 'emsdk-cache'

      - name: Verify Emscripten
        run: emcc -v

      - name: Install Meson
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install meson ninja

      - name: Meson Setup
        run: meson setup build-web --cross-file web.ini

      - name: Meson Compile
        run: meson compile -C build-web

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build-web/   # Path to your built static files

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
